name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    name: Larastan

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl, pcntl, sqlite, pdo_sqlite
          coverage: none

      # The package ships no composer.lock, so there is nothing to install from.
      - run: composer update --prefer-dist --no-interaction

      - run: vendor/bin/phpstan analyse --error-format=github --no-progress

  code-style:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl, pcntl, sqlite, pdo_sqlite
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - run: vendor/bin/pint --test
