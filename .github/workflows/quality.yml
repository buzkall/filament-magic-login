name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    name: Larastan

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl, pcntl, sqlite, pdo_sqlite
          coverage: none

      # The package ships no composer.lock, so there is nothing to install from.
      - run: composer update --prefer-dist --no-interaction

      - run: vendor/bin/phpstan analyse --error-format=github --no-progress

  code-style:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl, pcntl, sqlite, pdo_sqlite
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - run: vendor/bin/pint --test
